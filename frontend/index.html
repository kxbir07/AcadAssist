<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AcadAssist — AI-powered Personalized Academic Learning Assistant. Learn, Plan, Practice, and Grow." />
    <title>AcadAssist — Academic Learning Assistant</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('acadassist.settings');
          var theme = 'light';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.theme === 'dark') {
              theme = 'dark';
            }
          }
          document.documentElement.dataset.theme = theme;
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  </head>
  <body data-theme="light">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
